name: hydramind
description: Arabic-first offline hydration companion, restored from the development conversation.
publish_to: none
version: 1.0.1+2
environment:
  sdk: '>=3.8.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  flutter_riverpod: ^2.6.1
  drift: ^2.28.0
  sqlite3_flutter_libs: ^0.5.39
  flutter_secure_storage: ^9.2.4
  cryptography: ^2.7.0
  path_provider: ^2.1.5
  http: ^1.5.0
  geolocator: ^14.0.2
  flutter_local_notifications: ^19.4.0
  timezone: ^0.10.1
  flutter_timezone: ^4.1.1
  fl_chart: ^1.0.0
  pdf: ^3.11.3
  share_plus: ^11.1.0
  health: ^13.1.0
  permission_handler: ^12.0.1
  uuid: ^4.5.1
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
dependency_overrides:
  image: 4.5.4
flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/fonts/Cairo.ttf
    - assets/fonts/OFL.txt
  fonts:
    - family: Cairo
      fonts:
        - asset: assets/fonts/Cairo.ttf
